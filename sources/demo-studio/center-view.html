<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Center View</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #0b1020;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    /* Hover-hotspot in top-left corner */
    .backHotspot {
      position: fixed;
      top: 0;
      left: 0;
      width: 72px;
      height: 72px;
      z-index: 9999;
      background: transparent;
    }
    /* Hidden until hovered */
    .backBtn {
      position: absolute;
      top: 10px;
      left: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.35);
      background: rgba(13,20,40,0.72);
      color: #e6eeff;
      font-size: 12px;
      text-decoration: none;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease, background 180ms ease, border-color 180ms ease;
      backdrop-filter: blur(6px);
    }
    .backHotspot:hover .backBtn,
    .backHotspot:focus-within .backBtn {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .backBtn:hover {
      border-color: rgba(96,165,250,0.8);
      background: rgba(13,20,40,0.9);
    }

    #frameGrid {
      --cellW: 160px;
      --cellH: 90px;
      height: 100vh;
      padding: 10px;
      display: grid;
      gap: 10px;
      justify-content: center;
      align-content: center;
      overflow: hidden;
    }
    iframe.tile {
      width: var(--cellW);
      height: var(--cellH);
      border: 0;
      border-radius: 12px;
      background: #000;
      display: block;
    }
    iframe.center {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 12px;
      background: #000;
      display: block;
      min-width: 0;
      min-height: 0;
    }
  </style>
</head>
<body>
  <div class="backHotspot">
    <a class="backBtn" href="index.html" aria-label="Back to config">←Back</a>
  </div>

  <div id="frameGrid"></div>

  <script>
    function qs() { return new URLSearchParams(location.search); }
    const p = qs();

    const cols = Math.max(4, parseInt(p.get('cols') || '6', 10) || 6);
    const rows = Math.max(4, parseInt(p.get('rows') || '6', 10) || 6);

    const thumb = (p.get('thumb') || '1').trim();
    const ws = (p.get('ws') || '').trim();
    const port = (p.get('port') || '').trim();

    const metaFont = (p.get('meta_font') || p.get('fontsize') || '').trim();

    const idsRaw = (p.get('ids') || '');
    const ids = idsRaw.split(',').map(s => s.trim());
    let idx = 0;

    const centerOverride = (p.get('center') || '').trim();

    const VIDEO_AR = '16:9';
    const gridEl = document.getElementById('frameGrid');

    function computeCell16x9(cols, rows) {
      const pad = 10;
      const gap = 10;
      const availW = window.innerWidth - pad * 2;
      const availH = window.innerHeight - pad * 2;
      const maxW_byWidth = (availW - (cols - 1) * gap) / cols;
      const maxW_byHeight = ((availH - (rows - 1) * gap) * 16) / (rows * 9);
      let cellW = Math.floor(Math.max(80, Math.min(maxW_byWidth, maxW_byHeight)));
      let cellH = Math.round(cellW * 9 / 16);
      cellW = Math.round(cellH * 16 / 9);
      return { cellW, cellH };
    }

    function nextSender() {
      const s = ids[idx];
      idx++;
      return (s || '').trim();
    }

    function makeViewerUrl({ sender, numericId, videoOnly, videoAr }) {
      const u = new URLSearchParams();
      u.set('compact', '1');
      u.set('layout', 'bottom');
      u.set('thumb', thumb);

      if (metaFont) u.set('meta_font', metaFont);

      if (sender) u.set('sender', sender);
      else u.set('id', String(numericId));
      if (videoOnly) u.set('video', '1');
      if (videoAr) u.set('videoar', videoAr);
      if (ws) u.set('ws', ws);
      if (port) u.set('port', port);
      return `webrtc.html?${u.toString()}`;
    }

    function rebuild() {
      const { cellW, cellH } = computeCell16x9(cols, rows);
      gridEl.style.setProperty('--cellW', `${cellW}px`);
      gridEl.style.setProperty('--cellH', `${cellH}px`);
      gridEl.style.gridTemplateColumns = `repeat(${cols}, var(--cellW))`;
      gridEl.style.gridTemplateRows = `repeat(${rows}, var(--cellH))`;
      gridEl.innerHTML = '';

      let numericId = 1;

      function addSmall(r, c) {
        const f = document.createElement('iframe');
        f.className = 'tile';
        const sender = nextSender();
        f.src = makeViewerUrl({ sender, numericId, videoOnly: true });
        f.style.gridRow = String(r);
        f.style.gridColumn = String(c);
        gridEl.appendChild(f);
        numericId++;
      }

      // Top row
      for (let c = 1; c <= cols; c++) addSmall(1, c);
      // Left col
      for (let r = 2; r <= rows; r++) addSmall(r, 1);
      // Right col
      for (let r = 2; r <= rows; r++) addSmall(r, cols);

      const center = document.createElement('iframe');
      center.className = 'center';
      const centerSender = centerOverride || nextSender();
      center.src = makeViewerUrl({
        sender: centerSender,
        numericId,
        videoOnly: false,
        videoAr: VIDEO_AR
      });
      center.style.gridRow = `2 / ${rows + 1}`;
      center.style.gridColumn = `2 / ${cols}`;
      gridEl.appendChild(center);
    }

    window.addEventListener('resize', rebuild);
    rebuild();
  </script>
</body>
</html>
